<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des examens</title>
</head>
<body>
    <nav style="background: #f4f4f4; padding: 10px; margin-bottom: 20px; border-bottom: 1px solid #ccc;">
    <a href="index.html" style="margin-right: 15px;">-Créer Examen</a>
    <a href="ajouter-question.html" style="margin-right: 15px;">-Ajouter Question</a>
    <a href="examen.html">-Liste des Examens</a>
</nav>
    <h1>Examens enregistrés</h1>
    
    <input type="text" id="proprietaire" placeholder="Nom du propriétaire">
    <button id="afficher">Afficher</button>
    
    <div id="resultat"></div>

    <script>
        document.getElementById('afficher').addEventListener('click', () => {
            // 1. Lire le nom du proprietaire
            const prop = document.getElementById('proprietaire').value;
            const key = 'examens_' + prop;

            // 2. Recuperer les examens depuis le localStorage
            const exams = JSON.parse(localStorage.getItem(key)) || [];

            // 3. Vider l'affichage précédent
            const res = document.getElementById('resultat');
            res.innerHTML = '';

            // 4. Cas ou aucun examen n'est trouve
            if (exams.length === 0) {
                res.innerHTML = '<p>Aucun examen trouvé pour ce propriétaire.</p>';
                return;
            }

            // 5. Afficher chaque examen et ses questions
            exams.forEach((exam) => {
                // Creer un titre pour l'examen
                const h2 = document.createElement('h2');
                h2.textContent = `Examen : ${exam.nom} (${exam.duree} min)`;
                res.appendChild(h2);

                const p = document.createElement('p');
                p.textContent = `Description : ${exam.description}`;
                res.appendChild(p);

                // Afficher les questions
                const ul = document.createElement('ul');
                exam.questions.forEach((q) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${q.title}</strong> (${q.points} pts) - ${q.time} sec`;
                // Afficher les propositions de la question ---
                const olProps = document.createElement('ol'); // Liste ordonnee pour les réponses
                q.answers.forEach((ans) => {
                const liProp = document.createElement('li');
                liProp.textContent = ans.text + (ans.correct ? " correcte" : "");
                olProps.appendChild(liProp);
    });
    li.appendChild(olProps); 
    ul.appendChild(li);
});
                res.appendChild(ul);
                res.appendChild(document.createElement('hr'));
            });
        });
    </script>
</body>
</html>
