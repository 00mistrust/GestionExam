<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une question</title>
</head>
<body>
    <nav style="background: #f4f4f4; padding: 10px; margin-bottom: 20px; border-bottom: 1px solid #ccc;">
    <a href="index.html" style="margin-right: 15px;">-Créer Examen</a>
    <a href="ajouter-question.html" style="margin-right: 15px;">-Ajouter Question</a>
    <a href="examen.html">-Liste des Examens</a>
</nav>
    <h1>Ajouter une question à un examen</h1>
    <form id="form-question">
        <input type="text" id="proprietaire" placeholder="Nom du propriétaire" required><br>
        <input type="text" id="nom-examen" placeholder="Nom de l'examen" required><br>
        <textarea id="enonce" placeholder="Énoncé de la question" required></textarea><br>
        <input type="number" id="duree" placeholder="Durée (secondes)" required><br>
        <input type="number" id="points" placeholder="Points" required><br>
        
        <div id="propositions"></div> <button type="button" id="add-propositions">Ajouter une proposition</button>
        <button type="submit">Ajouter la question</button>
    </form>
    <script src="js/ajouter-question.js"></script>
</body>
</html>
